# ===== 模型 =====
model.provider=deepseek
model.url=https://api.deepseek.com/v1/chat/completions
model.key=
model.name=deepseek-v4-flash
model.thinking=true
model.reasoningEffort=max
model.maxContextTokens=900000

# ===== 上下文压缩 =====
context.compressThreshold=0.8
context.keepRecentMessages=10

# ===== 路径 =====
work.dir=.
project.md.path=./project.md
skills.dir=./skills
session.dir=./.minion/sessions
# 读逃逸：true 时 Read/Grep/Glob 可读取工作区外文件（写入工具仍受限）；false（默认）时越界读弹确认
paths.read.allowOutside=false

# ===== 高危操作确认 =====
confirm.skip=false
confirm.whitelist.tools=
confirm.whitelist.commands=

# ===== UI =====
ui.color=true

# ===== 浏览器工具(CDP 驱动 Chrome,需 Chrome 109+) =====
browser.path=
browser.port=9222
browser.userDataDir=./.minion/browser-profile
browser.headless=false
browser.timeoutMs=30000
